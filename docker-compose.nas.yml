services:
  attend:
    image: attend:latest
    container_name: attend
    ports:
      - "8102:8102"
    environment:
      DATA_DIR: /data
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./data:/data
      - ./app.py:/app/app.py:ro
      - ./index.html:/app/index.html:ro
    restart: unless-stopped
